services:

  # ============================================
  # Shared Infrastructure Services
  # ============================================

  shared-postgres:
    container_name: shared-postgres
    image: postgres:16.4-alpine
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password
    volumes:
      - ./additional_config/pg_init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -h 127.0.0.1 || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"
    networks:
      - dsp-native-basyx

  shared-vault:
    container_name: shared-vault
    image: vault:1.13.3
    command: server -dev -dev-root-token-id=vaultsecret0123456789 -dev-listen-address=0.0.0.0:8200
    environment:
      VAULT_ADDR: http://0.0.0.0:8200
      SKIP_SETCAP: true
      SKIP_CHOWN: true
    healthcheck:
      test: ["CMD", "sh", "-c", "VAULT_ADDR=http://127.0.0.1:8200 vault status >/dev/null 2>&1"]
      interval: 4s
      timeout: 3s
      retries: 20
    ports:
      - "8200:8200"
    networks:
      - dsp-native-basyx

  vault-init:
    container_name: vault-init
    image: alpine:3.19
    depends_on:
      shared-vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://shared-vault:8200
      VAULT_TOKEN: vaultsecret0123456789
    volumes:
      - ./additional_config/vault-init.sh:/scripts/init.sh:ro
    entrypoint: [ "sh", "-c", "apk add --no-check-certificate --no-cache curl jq openssl && sh /scripts/init.sh" ]
    restart: "no"
    networks:
      - dsp-native-basyx

  # ============================================
  # Identity Hub Services (EDC Identity Hub)
  # ============================================

  local-issuer-service:
    container_name: local-issuer-service
    image: issuerservice-dev:latest
    pull_policy: missing
    depends_on:
      shared-postgres:
        condition: service_healthy
      shared-vault:
        condition: service_healthy
    ports:
      - "1044:1044"         # debugger
      - "10000:80"          # did API
      - "10100:15151"       # identity API
      - "10200:15152"       # issueradmin API
      - "13132:13132"       # issuance API
    environment:
      - JAVA_TOOL_OPTIONS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:1044
      - edc.statuslist.callback.address=http://local-issuer-service:9999/statuslist
      - edc.hostname=local-issuer-service
      - edc.ih.issuer.demonstrator.defaultconfig=/app/setup.json
      - edc.issuer.issuance.send.retry.limit=0
      - edc.iam.did.web.use.https=false
      - edc.ih.api.superuser.id=admin
      - edc.ih.api.superuser.key=YWRtaW4.adminKey
      - edc.issuer.statuslist.signing.key.alias=foo
      - web.http.did.port=80
      - edc.sql.schema.autocreate=true
      - edc.datasource.default.url=jdbc:postgresql://shared-postgres:5432/iss_db
      - edc.datasource.default.user=admin
      - edc.datasource.default.password=password
      - edc.vault.hashicorp.url=http://shared-vault:8200
      - edc.vault.hashicorp.health.check.enabled=true
      - edc.vault.hashicorp.token=vaultsecret0123456789
    volumes:
      - ./additional_config/mc-cred-def.json:/app/setup.json
      - ./additional_config/logging.properties:/app/logging.properties
    networks:
      - dsp-native-basyx

  provider-idhub:
    container_name: provider-idhub
    image: identityhub-dev:latest
    pull_policy: missing
    depends_on:
      shared-postgres:
        condition: service_healthy
      shared-vault:
        condition: service_healthy
    ports:
      - "1046:1046"         # debugger
      - "21000:80"          # did API
      - "21100:15151"       # identity API
      - "21500:9292"        # sts API
      - "21600:13131"       # credentials API
    environment:
      - JAVA_TOOL_OPTIONS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:1046
      - edc.hostname=provider-idhub
      - edc.ih.issuer.demonstrator.scope=org.eclipse.tractusx.vc.type
      - edc.iam.did.web.use.https=false
      - edc.ih.api.superuser.id=admin
      - edc.ih.api.superuser.key=YWRtaW4.adminKey
      - web.http.did.port=80
      - edc.sql.schema.autocreate=true
      - edc.datasource.default.url=jdbc:postgresql://shared-postgres:5432/prov_ih_db
      - edc.datasource.default.user=admin
      - edc.datasource.default.password=password
      - edc.vault.hashicorp.url=http://shared-vault:8200
      - edc.vault.hashicorp.health.check.enabled=true
      - edc.vault.hashicorp.token=vaultsecret0123456789
    volumes:
      - ./additional_config/logging.properties:/app/logging.properties
    networks:
      - dsp-native-basyx

  # ============================================
  # DSP Native BaSyx Application
  # ============================================

  dsp-native-basyx:
    container_name: dsp-native-basyx
    image: ghcr.io/factory-x-contributions/dsp-native-basyx:0.0.3
    environment:
      - basyx.feature.authorization.rbac.file=file:/app/resources/rules.json
      - spring.security.oauth2.resourceserver.jwt.issuer-uri=http://provider-idhub:9292/api/identity
      - org.factoryx.library.hostname=dsp-native-basyx
      - spring.data.mongodb.uri=mongodb://mongoAdmin:mongoPassword@mongo
      - spring.data.mongodb.port=27017
      - spring.data.mongodb.database=factoryx-mongo-db
      - spring.data.mongodb.username=mongoAdmin
      - spring.data.mongodb.password=mongoPassword
      - org.factoryx.library.id=did:web:provider-idhub:user:provider
      - org.factoryx.library.validationservice=idhub
      - org.factoryx.library.idhub.sts.url=http://provider-idhub:9292/api/sts
      - org.factoryx.library.idhub.sts.clientid=did:web:provider-idhub:user:provider
      - org.factoryx.library.policyservice=fxv0_1
      - basyx.feature.mqtt.enabled=true
      - mqtt.clientId=dsp-native-basyx
      - mqtt.hostname=mqtt-broker
      - mqtt.port=1883
      - mqtt.protocol=tcp
      - mqtt.username=user
      - mqtt.password=pw
    volumes:
      - ./src/main/resources/rules.json:/app/resources/rules.json:ro
    depends_on:
      mongo:
        condition: service_healthy
      provider-idhub:
        condition: service_started
      shared-vault:
        condition: service_healthy
    ports:
      - 8090:8090
      - 5005:5005
    networks:
      - dsp-native-basyx
    extra_hosts:
      - "host.docker.internal:host-gateway"

  mqtt-broker:
    container_name: mqtt-broker
    image: eclipse-mosquitto:2
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
    ports:
      - 1883:1883
    networks:
      - dsp-native-basyx

  # ============================================
  # EDC Consumer Control Plane
  # ============================================

  consumer-controlplane:
    container_name: consumer-controlplane
    image: edc-controlplane-postgresql-hashicorp-vault:latest
    pull_policy: missing
    environment:
      - JAVA_TOOL_OPTIONS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=0.0.0.0:5005
      - edc.iam.trusted-issuer.example.id=did:web:local-issuer-service:fx-issuer
      - edc.iam.did.web.use.https=false
      - edc.iam.sts.oauth.client.secret.alias=consumersecret
      - edc.iam.credential.revocation.mimetype=application/json
      - edc.iam.sts.oauth.token.url=http://consumer-idhub:9292/api/sts/token
      - edc.iam.sts.oauth.client.id=did:web:consumer-idhub:user:consumer
      - edc.iam.issuer.id=did:web:consumer-idhub:user:consumer
      - web.http.port=9000
      - web.http.path=/api
      - web.http.management.port=9010
      - web.http.management.path=/management
      - web.http.protocol.port=9020
      - web.http.protocol.path=/dsp
      - web.http.validation.port=9030
      - web.http.validation.path=/validation
      - web.http.control.port=9050
      - web.http.control.path=/control
      - edc.hostname=consumer-controlplane
      - edc.participant.id=did:web:consumer-idhub:user:consumer
      - edc.dsp.callback.address=http://consumer-controlplane:9020/dsp
      - edc.sql.schema.autocreate=true
      - edc.datasource.default.url=jdbc:postgresql://shared-postgres:5432/cons_cpl
      - edc.datasource.default.user=admin
      - edc.datasource.default.password=password
      - edc.vault.hashicorp.url=http://shared-vault:8200
      - edc.vault.hashicorp.health.check.enabled=true
      - edc.vault.hashicorp.token=vaultsecret0123456789
    volumes:
      - ./additional_config/logging.properties:/app/dataspaceconnector-configuration.properties
    depends_on:
      shared-postgres:
        condition: service_healthy
      shared-vault:
        condition: service_healthy
    entrypoint: [ "java", "-jar", "edc-runtime.jar", "--log-level=DEBUG" ]
    ports:
      - "29000:9000"  # Default port
      - "29010:9010"  # Management API
      - "29020:9020"  # DSP API
    networks:
      - dsp-native-basyx

  consumer-idhub:
    container_name: consumer-idhub
    image: identityhub-dev:latest
    pull_policy: missing
    depends_on:
      shared-postgres:
        condition: service_healthy
      shared-vault:
        condition: service_healthy
    ports:
      - "1045:1045"         # debugger
      - "20000:80"          # did API
      - "20100:15151"       # identity API
      - "20500:9292"        # sts API
      - "20600:13131"       # credentials API
    environment:
      - JAVA_TOOL_OPTIONS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:1045
      - edc.hostname=consumer-idhub
      - edc.ih.issuer.demonstrator.scope=org.eclipse.tractusx.vc.type
      - edc.iam.did.web.use.https=false
      - edc.ih.api.superuser.id=admin
      - edc.ih.api.superuser.key=YWRtaW4.adminKey
      - web.http.did.port=80
      - edc.sql.schema.autocreate=true
      - edc.datasource.default.url=jdbc:postgresql://shared-postgres:5432/cons_ih_db
      - edc.datasource.default.user=admin
      - edc.datasource.default.password=password
      - edc.vault.hashicorp.url=http://shared-vault:8200
      - edc.vault.hashicorp.health.check.enabled=true
      - edc.vault.hashicorp.token=vaultsecret0123456789
    volumes:
      - ./additional_config/logging.properties:/app/logging.properties
    networks:
      - dsp-native-basyx

  # ============================================
  # MongoDB (for DSP Native BaSyx)
  # ============================================

  mongo:
    image: mongo:5.0.10
    ports:
      - "27017:27017"
    container_name: mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongoAdmin
      MONGO_INITDB_ROOT_PASSWORD: mongoPassword
    restart: always
    healthcheck:
      test: mongo
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dsp-native-basyx

  # ============================================
  # Optional: DNS Host Resolver
  # ============================================

  dsp-native-basyx-dns-host-resolver:
    container_name: resolver
    image: dvdarias/docker-hoster:latest
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock
      - /etc/hosts:/tmp/hosts

networks:
  dsp-native-basyx:
    name: dsp-native-basyx
    driver: bridge
