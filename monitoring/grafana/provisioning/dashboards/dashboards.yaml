# Grafana dashboard provisioning — applied on startup.
# Docs: https://grafana.com/docs/grafana/latest/administration/provisioning/#dashboards
#
# Loads every *.json file under /etc/grafana/dashboards (a read-only bind mount
# from ./monitoring/grafana/dashboards) into the "DSP-Native BaSyx" folder in
# the UI.

apiVersion: 1

providers:
  - name: dsp-native-basyx
    orgId: 1
    folder: DSP-Native BaSyx
    type: file
    # Dashboards edited in the UI won't be overwritten unless the file on disk
    # changes — lets you tweak a panel without losing it on next `up`.
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false
