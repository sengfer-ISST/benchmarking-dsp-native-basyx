# One-time setup: download the OTel java-agent jar before first `up`:
#   curl -L -o additional_config/opentelemetry-javaagent.jar \
#     https://github.com/open-telemetry/opentelemetry-java-instrumentation/releases/download/v2.8.0/opentelemetry-javaagent.jar

services:
  local-issuer-service:
    container_name: local-issuer-service
    image: issuerservice-dev:latest
    pull_policy: never
    deploy:
      resources:
        limits:
          memory: 768M
    depends_on:
      shared-postgres:
        condition: service_healthy
      shared-vault:
        condition: service_healthy
    ports:
      - "10000:80"          # did API
      - "10100:15151"       # identity API
      - "10200:15152"       # issueradmin API
    environment:
      - JAVA_TOOL_OPTIONS=-Xms256m -Xmx512m -javaagent:/app/opentelemetry-javaagent.jar -Dotel.javaagent.configuration-file=/app/opentelemetry.properties
      - OTEL_SERVICE_NAME=local-issuer-service
      - OTEL_RESOURCE_ATTRIBUTES=service.namespace=dsp-native-basyx-mvd,service.instance.id=local-issuer-service
      - edc.statuslist.callback.address=http://local-issuer-service:9999/statuslist
      - edc.hostname=local-issuer-service
      - edc.ih.issuer.dev.defaultconfig=/app/setup.json
      - edc.issuer.issuance.send.retry.limit=0
      - edc.iam.did.web.use.https=false
      - edc.ih.api.superuser.id=admin
      - edc.ih.api.superuser.key=YWRtaW4.adminKey
      - edc.issuer.statuslist.signing.key.alias=foo
      - web.http.did.port=80
      - edc.sql.schema.autocreate=true
      - edc.datasource.default.url=jdbc:postgresql://shared-postgres:5432/iss_db
      - edc.datasource.default.user=admin
      - edc.datasource.default.password=password
      - edc.vault.hashicorp.url=http://shared-vault:8200
      - edc.vault.hashicorp.health.check.enabled=true
      - edc.vault.hashicorp.token=vaultsecret0123456789
    volumes:
      - ./additional_config/mc-cred-def.json:/app/setup.json
      - ./additional_config/logging.properties:/app/logging.properties
      - ./additional_config/opentelemetry-javaagent.jar:/app/opentelemetry-javaagent.jar:ro
      - ./additional_config/opentelemetry.properties:/app/opentelemetry.properties:ro
    networks:
      - dsp-native-basyx

  shared-postgres:
    container_name: shared-postgres
    image: postgres:16.4-alpine
    pull_policy: never
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password
    volumes:
      - ./additional_config/pg_init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -h 127.0.0.1 || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"
    networks:
      - dsp-native-basyx

  shared-vault:
    container_name: shared-vault
    image: vault:1.13.3
    pull_policy: never
    deploy:
      resources:
        limits:
          memory: 512M
    command: server -dev -dev-root-token-id=vaultsecret0123456789 -dev-listen-address=0.0.0.0:8200
    environment:
      VAULT_ADDR: http://0.0.0.0:8200
      SKIP_SETCAP: "true"
      SKIP_CHOWN: "true"
    healthcheck:
      test: ["CMD", "sh", "-c", "VAULT_ADDR=http://127.0.0.1:8200 vault status >/dev/null 2>&1"]
      interval: 4s
      timeout: 3s
      retries: 20
    ports:
      - "8200:8200"
    networks:
      - dsp-native-basyx

  vault-init:
    container_name: vault-init
    image: alpine:3.19
    pull_policy: never
    depends_on:
      shared-vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://shared-vault:8200
      VAULT_TOKEN: vaultsecret0123456789
    volumes:
      - ./additional_config/vault-init.sh:/scripts/init.sh:ro
    entrypoint: [
      "sh", "-c",
      "apk add --no-check-certificate --no-cache curl jq openssl \
       && tr -d '\r' < /scripts/init.sh > /tmp/init.sh \
       && sh /tmp/init.sh"
    ]
    restart: "no"
    networks:
      - dsp-native-basyx

  consumer-idhub:
    container_name: consumer-idhub
    image: identityhub-dev:latest
    pull_policy: never
    deploy:
      resources:
        limits:
          memory: 768M
    depends_on:
      shared-postgres:
        condition: service_healthy
      shared-vault:
        condition: service_healthy
    ports:
      - "20000:80"          # did API
      - "20100:15151"       # identity API
      - "20500:9292"        # sts API
      - "20600:13131"       # credentials API
    environment:
      - JAVA_TOOL_OPTIONS=-Xms256m -Xmx512m -javaagent:/app/opentelemetry-javaagent.jar -Dotel.javaagent.configuration-file=/app/opentelemetry.properties
      - OTEL_SERVICE_NAME=consumer-idhub
      - OTEL_RESOURCE_ATTRIBUTES=service.namespace=dsp-native-basyx-mvd,service.instance.id=consumer-idhub
      - edc.hostname=consumer-idhub
      - edc.iam.did.web.use.https=false
      - edc.ih.api.superuser.id=admin
      - edc.ih.api.superuser.key=YWRtaW4.adminKey
      - web.http.did.port=80
      - edc.sql.schema.autocreate=true
      - edc.datasource.default.url=jdbc:postgresql://shared-postgres:5432/cons_ih_db
      - edc.datasource.default.user=admin
      - edc.datasource.default.password=password
      - edc.vault.hashicorp.url=http://shared-vault:8200
      - edc.vault.hashicorp.health.check.enabled=true
      - edc.vault.hashicorp.token=vaultsecret0123456789
    volumes:
      - ./additional_config/logging.properties:/app/logging.properties
      - ./additional_config/opentelemetry-javaagent.jar:/app/opentelemetry-javaagent.jar:ro
      - ./additional_config/opentelemetry.properties:/app/opentelemetry.properties:ro
    networks:
      - dsp-native-basyx

  provider-idhub:
    container_name: provider-idhub
    image: identityhub-dev:latest
    pull_policy: never
    deploy:
      resources:
        limits:
          memory: 768M
    depends_on:
      shared-postgres:
        condition: service_healthy
      shared-vault:
        condition: service_healthy
    ports:
      - "21000:80"          # did API
      - "21100:15151"       # identity API
      - "21500:9292"        # sts API
      - "21600:13131"       # credentials API
    environment:
      - JAVA_TOOL_OPTIONS=-Xms256m -Xmx512m -javaagent:/app/opentelemetry-javaagent.jar -Dotel.javaagent.configuration-file=/app/opentelemetry.properties
      - OTEL_SERVICE_NAME=provider-idhub
      - OTEL_RESOURCE_ATTRIBUTES=service.namespace=dsp-native-basyx-mvd,service.instance.id=provider-idhub
      - edc.hostname=provider-idhub
      - edc.iam.did.web.use.https=false
      - edc.ih.api.superuser.id=admin
      - edc.ih.api.superuser.key=YWRtaW4.adminKey
      - web.http.did.port=80
      - edc.sql.schema.autocreate=true
      - edc.datasource.default.url=jdbc:postgresql://shared-postgres:5432/prov_ih_db
      - edc.datasource.default.user=admin
      - edc.datasource.default.password=password
      - edc.vault.hashicorp.url=http://shared-vault:8200
      - edc.vault.hashicorp.health.check.enabled=true
      - edc.vault.hashicorp.token=vaultsecret0123456789
    volumes:
      - ./additional_config/logging.properties:/app/logging.properties
      - ./additional_config/opentelemetry-javaagent.jar:/app/opentelemetry-javaagent.jar:ro
      - ./additional_config/opentelemetry.properties:/app/opentelemetry.properties:ro
    networks:
      - dsp-native-basyx

  dsp-native-basyx:
    container_name: dsp-native-basyx
    image: dsp-native-basyx:patched-edDSA
    pull_policy: never
    deploy:
      resources:
        limits:
          memory: 1024M
    environment:
      # ── OTel java-agent (zero-code instrumentation of Spring Boot / Tomcat) ─
      - JAVA_TOOL_OPTIONS=-Xms512m -Xmx768m -javaagent:/app/opentelemetry-javaagent.jar -Dotel.javaagent.configuration-file=/app/opentelemetry.properties
      - OTEL_SERVICE_NAME=dsp-native-basyx
      - OTEL_RESOURCE_ATTRIBUTES=service.namespace=dsp-native-basyx-mvd,service.instance.id=dsp-native-basyx
      # ── BaSyx RBAC ─────────────────────────────────────────────
      - basyx.feature.authorization.rbac.file=file:/app/resources/rules.json
      - spring.security.oauth2.resourceserver.jwt.issuer-uri=http://keycloak:8080/realms/dsp-native-basyx
      # ── MongoDB ────────────────────────────────────────────────
      - spring.data.mongodb.uri=mongodb://mongoAdmin:mongoPassword@mongo
      - spring.data.mongodb.port=27017
      - spring.data.mongodb.database=factoryx-mongo-db
      - spring.data.mongodb.username=mongoAdmin
      - spring.data.mongodb.password=mongoPassword
      # ── Provider Identity ──────────────────────────────────────
      - org.factoryx.library.hostname=dsp-native-basyx
      # becomes client_id in STS calls AND aud check in inbound tokens
      - org.factoryx.library.id=did:web:provider-idhub:user:provider
      # ── Validation mode ────────────────────────────────────────
      - org.factoryx.library.validationservice=mvd
      # ── MVD outbound: fetch secret from Vault, call provider STS
      - org.factoryx.library.mvd.vaultroottoken=vaultsecret0123456789
      - org.factoryx.library.mvd.vaulturl=http://shared-vault:8200
      - org.factoryx.library.mvd.vaultsecretalias=providersecret
      - org.factoryx.library.mvd.ststokenurl=http://provider-idhub:9292/api/sts/token
      # ── MVD inbound: VC issuer trust anchor ───────────────────
      - org.factoryx.library.mvd.trustedissuer=did:web:local-issuer-service:fx-issuer
      # ── MQTT ───────────────────────────────────────────────────
      - basyx.feature.mqtt.enabled=true
      - mqtt.clientId=dsp-native-basyx
      - mqtt.hostname=mqtt-broker
      - mqtt.port=1883
      - mqtt.protocol=tcp
      - mqtt.username=user
      - mqtt.password=pw
    volumes:
      - ./src/main/resources/rules.json:/app/resources/rules.json:ro
      - ./additional_config/opentelemetry-javaagent.jar:/app/opentelemetry-javaagent.jar:ro
      - ./additional_config/opentelemetry.properties:/app/opentelemetry.properties:ro
    depends_on:
      mongo:
        condition: service_healthy
      provider-idhub:
        condition: service_started
      shared-vault:
        condition: service_healthy
      local-issuer-service:
        condition: service_started   # MvdValidationService resolves its DID
      consumer-idhub:
        condition: service_started   # MvdValidationService calls its credential service
      mqtt-broker:
        condition: service_started   # configured to connect on startup
      keycloak:
        condition: service_started
    ports:
      - 8090:8090
    networks:
      - dsp-native-basyx
    extra_hosts:
      - "host.docker.internal:host-gateway"

  consumer-controlplane:
    container_name: consumer-controlplane
    image: edc-controlplane-postgresql-hashicorp-vault:latest
    pull_policy: never
    deploy:
      resources:
        limits:
          memory: 1024M
    environment:
      - JAVA_TOOL_OPTIONS=-Xms512m -Xmx768m -javaagent:/app/opentelemetry-javaagent.jar -Dotel.javaagent.configuration-file=/app/opentelemetry.properties
      - OTEL_SERVICE_NAME=consumer-controlplane
      - OTEL_RESOURCE_ATTRIBUTES=service.namespace=dsp-native-basyx-mvd,service.instance.id=consumer-controlplane
      - edc.iam.trusted-issuer.example.id=did:web:local-issuer-service:fx-issuer
      - edc.iam.did.web.use.https=false
      - edc.iam.sts.oauth.client.secret.alias=consumersecret
      - edc.iam.credential.revocation.mimetype=application/json
      - edc.iam.sts.oauth.token.url=http://consumer-idhub:9292/api/sts/token
      - edc.iam.sts.oauth.client.id=did:web:consumer-idhub:user:consumer
      - edc.iam.issuer.id=did:web:consumer-idhub:user:consumer
      - web.http.port=9000
      - web.http.path=/api
      - web.http.management.port=9010
      - web.http.management.path=/management
      - web.http.protocol.port=9020
      - web.http.protocol.path=/dsp
      - web.http.validation.port=9030
      - web.http.validation.path=/validation
      - web.http.control.port=9050
      - web.http.control.path=/control
      - edc.hostname=consumer-controlplane
      - edc.participant.id=did:web:consumer-idhub:user:consumer
      - edc.dsp.callback.address=http://consumer-controlplane:9020/dsp
      - edc.sql.schema.autocreate=true
      - edc.datasource.default.url=jdbc:postgresql://shared-postgres:5432/cons_cpl
      - edc.datasource.default.user=admin
      - edc.datasource.default.password=password
      - edc.vault.hashicorp.url=http://shared-vault:8200
      - edc.vault.hashicorp.health.check.enabled=true
      - edc.vault.hashicorp.token=vaultsecret0123456789
    volumes:
      - ./additional_config/logging.properties:/app/dataspaceconnector-configuration.properties
      - ./additional_config/opentelemetry-javaagent.jar:/app/opentelemetry-javaagent.jar:ro
      - ./additional_config/opentelemetry.properties:/app/opentelemetry.properties:ro
    depends_on:
      shared-postgres:
        condition: service_healthy
      shared-vault:
        condition: service_healthy
      consumer-idhub:
        condition: service_started
    entrypoint: [ "java", "-jar", "edc-runtime.jar", "--log-level=DEBUG" ]
    ports:
      - "29000:9000"  # Default port
      - "29010:9010"  # Management API
      - "29020:9020"  # DSP API
    networks:
      - dsp-native-basyx

  keycloak:
    image: keycloak/keycloak:26.2
    container_name: keycloak
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      KC_HOSTNAME: keycloak
      KC_SPI_INITIALIZER_ISSUER_BASE_URI: http://localhost:8080
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: keycloak-admin
      KC_HEALTH_ENABLED: true
      KC_DB: dev-file
      KC_CACHE: local
    command: [ "start-dev", "--import-realm" ]
    ports:
      - 8080:8080
      - 9000:9000    # ← expose management port so healthcheck works
    volumes:
      - keycloak_data:/opt/jboss/keycloak/standalone/data
      - ./keycloak/realm:/opt/keycloak/data/import
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:9000/health/live || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks:
      - dsp-native-basyx

  mongo:
    image: mongo:5.0.10
    deploy:
      resources:
        limits:
          memory: 512M
    ports:
      - "27017:27017"
    container_name: mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongoAdmin
      MONGO_INITDB_ROOT_PASSWORD: mongoPassword
    restart: always
    healthcheck:
      test: mongo
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dsp-native-basyx

  mqtt-broker:
    container_name: mqtt-broker
    image: eclipse-mosquitto:2
    deploy:
      resources:
        limits:
          memory: 512M
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
    ports:
      - 1883:1883
    networks:
      - dsp-native-basyx

  dsp-native-basyx-dns-host-resolver:
    container_name: resolver
    image: dvdarias/docker-hoster:latest
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock
      - /etc/hosts:/tmp/hosts

  # ─────────────────────────────────────────────────────────────────────────
  # Monitoring overlay (Prometheus + Grafana + Tempo + OTel + node-exporter).
  # ─────────────────────────────────────────────────────────────────────────

  # Receives OTLP from the EDC + dsp-native-basyx java-agents, re-exports
  # metrics in Prometheus format (:8889) and forwards traces to Tempo.
  otel-collector:
    container_name: otel-collector
    image: otel/opentelemetry-collector-contrib:0.108.0
    command:
      - --config=/etc/otel-collector-config.yaml
    volumes:
      - ./monitoring/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP/gRPC ingest
      - "8889:8889"   # Prometheus metrics endpoint
    networks:
      - dsp-native-basyx
    restart: unless-stopped

  # Trace store. Receives spans from the collector and serves them to Grafana,
  # so a single negotiation/transfer can be followed across runtimes.
  tempo:
    container_name: tempo
    image: grafana/tempo:2.6.0
    command:
      - -config.file=/etc/tempo.yaml
    volumes:
      - ./monitoring/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"   # Tempo API (Grafana datasource queries this)
    networks:
      - dsp-native-basyx
    restart: unless-stopped

  # Host-level CPU / memory / disk / network / filesystem.
  # Lets us tell a container spike apart from a host-side bottleneck.
  node-exporter:
    container_name: node-exporter
    image: prom/node-exporter:v1.8.2
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|rootfs/var/lib/docker/containers|rootfs/var/lib/docker/overlay2|rootfs/run/docker/netns|rootfs/var/lib/docker/aufs)($$|/)
      - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$$
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - "9100:9100"
    networks:
      - dsp-native-basyx
    restart: unless-stopped

  # Scrapes node-exporter + the OTel collector; 5 s interval, 7 d retention.
  prometheus:
    container_name: prometheus
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - node-exporter
      - otel-collector
    networks:
      - dsp-native-basyx
    restart: unless-stopped

  # Grafana with provisioned Prometheus + Tempo datasources and the
  # "EDC API & Runtime (OTel)" + "Node Exporter Full" dashboards.
  grafana:
    container_name: grafana
    image: grafana/grafana:11.2.0
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - dsp-native-basyx
    restart: unless-stopped

volumes:
  keycloak_data:
  prometheus-data:
  grafana-data:
  tempo-data:

networks:
  dsp-native-basyx:
    name: dsp-native-basyx
    driver: bridge
